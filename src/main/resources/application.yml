server:
   error:
      path: /error2
      whitelabel:
         enabled: false
   port: 9091
   servlet:
      contextPath: /social-networking-service
spring:
   profiles:
      active: ${SPRING_PROFILE}
   application:
      name: social-networking-service
   banner:
      location: banner.txt
   config:
      import: classpath:creds.yaml
   cache:
      redis:
         enable-statistics: true
   cloud:
      config:
         discovery:
            enabled: false
   mail:
      host: smtp.gmail.com
      password: ${EMAIL_TOKEN}
      port: 587
      properties:
         mail:
            smtp:
               auth: true
               starttls:
                  enable: false
                  required: true
      test-connection: false
      username: ${EMAIL_USERNAME}
   main:
      lazy-initialization: true
   mvc:
      problemdetails:
         enabled: true
   security:
      user:
         name: user
         password: pass
   servlet:
      multipart:
         max-file-size: 50MB
         max-request-size: 50MB
   thymeleaf:
      cache: false
      enabled: 'true'
      prefix: classpath:/templates/
      suffix: .html

   ###### this will only if you are initializing datasource with spring jpa properties#####
   #defer-datasource-initialization: true
   #liquibase:
   #   change-log: classpath:db/changelog/master.yaml
   #   enabled: true
   sql:
      init:
         mode: always
         schema-locations: classpath:/sql/schema.sql

# move configuration to class level
#   kafka:
#      bootstrap-servers: localhost:9092
#      consumer:
#         key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
#         value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
#         properties:
#            spring.json.trusted.packages: "*"
#      producer:
#         key-serializer: org.apache.kafka.common.serialization.LongSerializer
#         value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

   output:
      ansi:
         enabled: always

liquibase-changelogs:
   primary:
      liquibase:
         change-log: classpath:db/changelog/master.yaml
cache:
   redis:
      enable: ${REDIS_CACHE_ENABLED}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
   simple:
      enable: ${SIMPLE_CACHE_ENABLED}
chatgpt:
   api-key: ''
eureka:
   client:
      fetch-registry: false
      register-with-eureka: false
      serviceUrl:
         defaultZone: http://localhost:8761/eureka
   instance:
      appname: profile
      prefer-ip-address: false
java:
   home: 'Java is installed in the folder: ${JAVA_HOME}'
logging:
   level:
      com:
         netflix:
            discovery: OFF
            eureka: OFF
      org:
         springframework:
            kafka: info
            security:
               web:
                  FilterChainProxy: DEBUG
      liquibase: debug

management:
   endpoint:
      health:
         show-details: always
   endpoints:
      web:
         exposure:
            include: '*'
         path-mapping:
            prometheus: "prometheus"
   metrics:
      tags:
        application: social-networking-service
   info:
      env:
         enabled: true
      git:
         enabled: true
         mode: full
   health:
      show-details: always
      redis:
         enabled: false
      mail:
         enabled: false
security:
   basic:
      authorize-mode: NONE
      enabled: true
springdoc:
   show-actuator: false

kafka:
   enabled: ${KAFKA_ENABLED}
   bootstrap:
      servers: ${KAFAK_BOOTSTRAP_SERVERS}